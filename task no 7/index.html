    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task 07 - CSS Layout & Animation</title>

<style>

/* ===== BASIC RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ===== HEADER ===== */
header {
  height: 100px;
  background: #333;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
}

/* ===== MAIN AREA USING calc() ===== */
main {
  height: calc(100vh - 100px); /* 100vh - header height */
  padding: 20px;
}

/* ===== FLEX LAYOUT ===== */
.flex-section {
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: #f2f2f2;
  height: 200px;
  margin-bottom: 20px;
}

.flex-box {
  width: 100px;
  height: 100px;
  background: orange;
}

/* ===== GRID LAYOUT ===== */
.grid-section {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.grid-box {
  height: 100px;
  background: lightblue;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
}

/* ===== ANIMATION ===== */
.animate-box {
  width: 100px;
  height: 100px;
  background: purple;
  margin: 20px auto;
  animation: rotateScale 3s infinite;
}

/* ===== KEYFRAMES ===== */
@keyframes rotateScale {
  0% {
    transform: rotate(0deg) scale(1);
  }
  50% {
    transform: rotate(180deg) scale(1.3);
  }
  100% {
    transform: rotate(360deg) scale(1);
  }
}

/* ===== MEDIA QUERIES ===== */

/* Mobile */
@media (max-width: 600px) {
  .grid-section {
    grid-template-columns: 1fr;
  }
}

/* Tablet */
@media (min-width: 601px) and (max-width: 1024px) {
  .grid-section {
    grid-template-columns: 1fr 1fr;
  }
}

/* Desktop */
@media (min-width: 1025px) {
  .grid-section {
    grid-template-columns: repeat(3, 1fr);
  }
}

</style>
</head>

<body>

<header>
  Header (100px Height)
</header>

<main>

  <!-- FLEX EXAMPLE -->
  <div class="flex-section">
    <div class="flex-box"></div>
    <div class="flex-box"></div>
    <div class="flex-box"></div>
  </div>

  <!-- GRID EXAMPLE -->
  <div class="grid-section">
    <div class="grid-box">1</div>
    <div class="grid-box">2</div>
    <div class="grid-box">3</div>
    <div class="grid-box">4</div>
    <div class="grid-box">5</div>
    <div class="grid-box">6</div>
  </div>

  <!-- ANIMATION -->
  <div class="animate-box"></div>

</main>

</body>
</html>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Contact Card</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body{
      background:#f2f5f9;
    }
    .contact-card{
      background: linear-gradient(180deg,#1fa2e1,#1c8cd6);
      color:#fff;
      border-radius:20px;
      padding:30px;
      max-width:420px;
    }
    .info-box{
      background: rgba(255,255,255,0.15);
      border-radius:15px;
      padding:15px;
    }
    .stat-box{
      background: rgba(255,255,255,0.15);
      border-radius:15px;
      padding:20px;
    }
    .social i{
      background: rgba(255,255,255,0.2);
      padding:10px;
      border-radius:50%;
      margin-right:10px;
    }
  </style>
</head>

<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
  
  <div class="contact-card text-center">

    <span class="badge bg-light text-primary mb-3">GET IN TOUCH</span>

    <h3 class="fw-bold mt-2">Let's Bring Your Vision to Life</h3>
    <p class="small">
      Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit.
    </p>

    <!-- Email -->
    <div class="info-box d-flex align-items-center mb-3">
      <i class="bi bi-envelope-fill fs-4 me-3"></i>
      <div class="text-start">
        <small>Email Us</small><br>
        <strong>support@example.com</strong>
      </div>
    </div>

    <!-- Call -->
    <div class="info-box d-flex align-items-center mb-3">
      <i class="bi bi-headset fs-4 me-3"></i>
      <div class="text-start">
        <small>Call Us</small><br>
        <strong>+1 (555) 890-1234</strong>
      </div>
    </div>

    <!-- Address -->
    <div class="info-box d-flex align-items-center mb-4">
      <i class="bi bi-geo-alt-fill fs-4 me-3"></i>
      <div class="text-start">
        <small>Visit Us</small><br>
        <strong>1847 Oak Avenue, Portland</strong>
      </div>
    </div>

    <!-- Stats -->
    <div class="stat-box d-flex justify-content-between mb-4">
      <div>
        <h4 class="fw-bold">98%</h4>
        <small>Satisfaction</small>
      </div>
      <div>
        <h4 class="fw-bold">24/7</h4>
        <small>Support</small>
      </div>
      <div>
        <h4 class="fw-bold">3.2k</h4>
        <small>Projects</small>
      </div>
    </div>

    <!-- Social -->
    <div class="social">
      <small class="me-2">Follow Us</small>
      <i class="bi bi-facebook"></i>
      <i class="bi bi-twitter-x"></i>
      <i class="bi bi-linkedin"></i>
      <i class="bi bi-instagram"></i>
    </div>

  </div>

</div>

</body>
</html>
